<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigos: barra da música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#060608;--hover:#1C1C24;--linha:rgba(233,234,238,.10);--linhaSuave:rgba(233,234,238,.055);
  --texto:#E9EAEE;--medio:#9DA0AA;--fraco:#84868F;--online:#3ECF6E;
  --display:"Archivo",system-ui,sans-serif;--body:"Public Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#101014;color:var(--texto);font-family:var(--body)}
.pagina{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
h1{font-family:var(--display);font-size:28px;letter-spacing:-.5px;margin:0 0 8px}
.intro{color:var(--medio);font-size:15px;line-height:1.6;max-width:820px;margin:0 0 26px}
.lado{display:flex;gap:22px;flex-wrap:wrap}
.opcao{flex:1;min-width:270px;max-width:360px}
.rot{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 4px}
.desc{color:var(--medio);font-size:13.5px;line-height:1.55;margin:0 0 12px;min-height:64px}
.lat{width:260px;border:1px solid var(--linha);border-radius:14px;background:rgba(12,12,16,.92);overflow:hidden}
.conta{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linhaSuave)}
.conta .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c79a6b,#6b4a2f);flex:none}
.conta .n{font-size:12.5px;font-weight:600}.conta .e{font-family:var(--mono);font-size:10px;color:#6b6d77;margin-top:2px}
.conta .eng{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--medio);font-size:15px;background:rgba(233,234,238,.05)}
.amigos{padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px}
.cab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--fraco);padding:0 6px 8px}
.am{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;cursor:pointer}
.am:hover{background:var(--hover)}
.f{position:relative;width:32px;height:32px;flex:none}
.f i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center;background-color:#1c1c24;font-style:normal;font-weight:700;font-size:12px}
.f b{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--online);border:2px solid #0c0c10}
.tx{min-width:0;flex:1}
.nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{font-size:11.5px;color:var(--medio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.am.parado .mu{color:var(--fraco)}
.ouvir{opacity:0;width:26px;height:26px;border-radius:50%;background:var(--texto);color:#111;display:grid;place-items:center;font-size:10px;flex:none;transition:opacity .15s}
.am:hover .ouvir{opacity:1}
/* A: fio por baixo */
.pb{height:2px;border-radius:1px;background:rgba(233,234,238,.14);margin-top:5px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--texto)}
/* B: fio com os tempos */
.pbt{display:flex;align-items:center;gap:6px;margin-top:4px}
.pbt .pb{flex:1;margin:0}
.pbt span{font-family:var(--mono);font-size:9.5px;color:var(--fraco)}
/* C: anel à volta da foto */
.anel{position:absolute;inset:-3px;width:38px;height:38px;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:2}
.anel .fundoAnel{stroke:rgba(233,234,238,.12)}
.anel .cheio{stroke:var(--texto);stroke-linecap:round}
.comAnel .f{margin:3px}
.comAnel .f b{right:-3px;bottom:-3px}
</style>
</head>
<body>
<div class="pagina">
<h1>Amigos na lateral: a barra da música</h1>
<p class="intro">Três maneiras de mostrar por onde vai a música de cada amigo, ao tamanho real da tua lateral. As barras andam como na app. Passa o rato por uma linha para ver o ▶ de ouvir com ele.</p>
<div class="lado" id="lado"></div>
</div>
<script>
const AMIGOS=[
  {n:'ganzas',foto:'https://i.ytimg.com/vi/mzB1VGEGcSU/mqdefault.jpg',m:'The Ultimate Rage',a:'Playboi Carti',dur:212,pos:48},
  {n:'juj',foto:'https://i.ytimg.com/vi/K5KAc5CoCuk/mqdefault.jpg',m:'Girls',a:'D12',dur:259,pos:170},
  {n:'raton',letra:'R',m:'All The Way Live',a:'Metro Boomin',dur:199,pos:12},
  {n:'SAMPAS',letra:'S'},
];
const OPCOES=[
  {id:'a',t:'A. Um fio por baixo',d:'O que está na app: um fio de 2 px por baixo da música. Discreto; diz "vai a meio" sem números.'},
  {id:'b',t:'B. O fio com os tempos',d:'O mesmo fio, com o tempo que já passou e a duração. Mais informação, mas são mais duas coisas a mexer em cada linha.'},
  {id:'c',t:'C. Um anel à volta da foto',d:'Sem nada por baixo do texto: o progresso é um anel fino à volta da foto do amigo. A linha fica igual à de agora.'},
];
const tempo=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const foto=a=>a.foto?`<i style="background-image:url(${a.foto})"></i>`:`<i>${a.letra}</i>`;
function linha(a,op){
  const toca=!!a.m;
  const f=`<div class="f">${foto(a)}${op==='c'&&toca?`<svg class="anel" viewBox="0 0 38 38"><circle class="fundoAnel" cx="19" cy="19" r="18"/><circle class="cheio" data-n="${a.n}" cx="19" cy="19" r="18" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg>`:''}<b></b></div>`;
  let barra='';
  if(toca&&op==='a')barra=`<div class="pb"><i data-n="${a.n}"></i></div>`;
  if(toca&&op==='b')barra=`<div class="pbt"><span data-t="${a.n}">0:00</span><div class="pb"><i data-n="${a.n}"></i></div><span>${tempo(a.dur)}</span></div>`;
  return `<div class="am ${toca?'':'parado'} ${op==='c'?'comAnel':''}">${f}<div class="tx"><div class="nm">${a.n}</div><div class="mu">${toca?`${a.m} · ${a.a}`:'Online'}</div>${barra}</div>${toca?'<div class="ouvir">▶</div>':''}</div>`;
}
document.getElementById('lado').innerHTML=OPCOES.map(o=>`<div class="opcao" data-op="${o.id}"><div class="rot">${o.t}</div><p class="desc">${o.d}</p><div class="lat"><div class="conta"><div class="av"></div><div><div class="n">joao</div><div class="e">jonyrsafonso@gmail…</div></div><div class="eng">⚙</div></div><div class="amigos"><div class="cab"><span>FRIENDS</span><span>4 ONLINE</span></div>${AMIGOS.map(a=>linha(a,o.id)).join('')}</div></div></div>`).join('');
function tique(){
  for(const a of AMIGOS){
    if(!a.m)continue;
    a.pos=(a.pos+1)%a.dur;
    const f=a.pos/a.dur;
    document.querySelectorAll(`.pb i[data-n="${a.n}"]`).forEach(el=>el.style.width=`${f*100}%`);
    document.querySelectorAll(`[data-t="${a.n}"]`).forEach(el=>el.textContent=tempo(a.pos));
    document.querySelectorAll(`.cheio[data-n="${a.n}"]`).forEach(el=>el.setAttribute('stroke-dashoffset',String(113.1*(1-f))));
  }
}
tique();setInterval(tique,1000);
</script>
</body>
</html>
