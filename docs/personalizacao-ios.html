<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personalizar o Duotone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--text:#F5F5F7;--t2:rgba(245,245,247,.62);--t3:rgba(245,245,247,.45);--sys:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#101014;color:var(--text);font-family:"Inter",system-ui,sans-serif}
.pagina{max-width:1320px;margin:0 auto;padding:36px 16px 80px}
h1{font-family:"Archivo",system-ui;font-size:30px;margin:0 0 8px;letter-spacing:-.4px}
.intro{color:var(--t2);font-size:15px;line-height:1.6;max-width:900px;margin:0 0 22px}
.ecras{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.coluna{display:flex;flex-direction:column;gap:12px;align-items:center}
.etq{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--t2);text-transform:uppercase}

.tel{width:390px;height:844px;border-radius:52px;position:relative;overflow:hidden;background:var(--fundoApp,#0A0A0F);
  box-shadow:0 0 0 10px #1b1b20,0 0 0 11px #2a2a31,0 30px 80px rgba(0,0,0,.6);font-family:var(--sys);transition:background .3s}
.estado{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font-weight:600;font-size:16px;position:relative;z-index:5}
.ilha{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.icones{font-size:13px;letter-spacing:2px}

/* ---------- as Definições: Customise ---------- */
.def{position:absolute;inset:54px 0 0;overflow-y:auto;padding:4px 0 40px;scrollbar-width:none}
.def::-webkit-scrollbar{display:none}
.defcab{display:flex;align-items:center;gap:6px;padding:4px 16px 2px;color:var(--acento);font-size:17px}
.defcab b{font-weight:400}
.deftit{font-size:32px;font-weight:700;padding:2px 20px 14px;letter-spacing:-.3px}
.temas{display:flex;gap:8px;overflow-x:auto;padding:0 20px 18px;scrollbar-width:none}
.temas::-webkit-scrollbar{display:none}
.tema{flex:none;width:86px;cursor:pointer;text-align:center}
.tema .mini{height:118px;border-radius:14px;border:2px solid transparent;overflow:hidden;position:relative;background:#14141c}
.tema.on .mini{border-color:var(--acento)}
.tema span{display:block;font-size:12px;margin-top:6px;color:var(--t2)}
.tema.on span{color:var(--text);font-weight:600}
.grupo-t{font-size:13px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;padding:16px 36px 6px}
.grupo{margin:0 16px;background:#1C1C24;border-radius:12px;overflow:hidden}
.linha{padding:11px 16px;border-bottom:.5px solid rgba(255,255,255,.08)}
.linha:last-child{border-bottom:0}
.linha .r{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.linha .v{color:var(--t2);font-size:13px}
.seg{display:flex;background:rgba(118,118,128,.24);border-radius:9px;padding:2px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:500 12.5px var(--sys);padding:6px 2px;border-radius:7px;cursor:pointer}
.seg button.on{background:#636366;font-weight:600}
.cores{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.cor{width:28px;height:28px;border-radius:14px;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);position:relative}
.cor.on{border-color:var(--text)}
.cor.capa{background:conic-gradient(#C76B4A,#2F4F6B,#8a3b2a,#C76B4A)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--t2);background:transparent;font-family:var(--sys)}
.chip.on{background:var(--acentoSoft);border-color:var(--acento);color:var(--text)}
.inter{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;cursor:pointer;flex:none;transition:background .2s}
.inter::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:transform .2s}
.inter.on{background:#34C759}
.inter.on::after{transform:translateX(20px)}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--acento)}

/* ---------- o leitor ---------- */
.np{position:absolute;inset:0}
.npfundo{position:absolute;inset:-40px;transition:opacity .3s}
.npveu{position:absolute;inset:0;transition:background .3s}
.npc{position:absolute;inset:54px 0 0;z-index:2;display:flex;flex-direction:column}
.cab{height:44px;margin-top:6px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.btn svg{width:24px;height:24px}
.centro{flex:1;display:flex;flex-direction:column;align-items:center}
.marca img{width:22px;height:22px}
.marca span{font-size:11px;font-weight:600;letter-spacing:2.6px;padding-left:2.6px}
.origem{display:flex;flex-direction:column;align-items:center}
.l1{position:relative;display:flex}
.l1 img{position:absolute;right:100%;margin-right:6px;width:14px;height:14px;top:0}
.olho{font-size:11px;font-weight:600;letter-spacing:1.2px;padding-left:1.2px;text-transform:uppercase;color:var(--t2)}
.nome{font-size:14px;font-weight:600}
.capa-area{flex:1;display:flex;align-items:center;justify-content:center;perspective:900px;position:relative}
.arte{background:radial-gradient(110px 110px at 30% 35%,rgba(255,220,180,.55),transparent 70%),linear-gradient(135deg,#C76B4A 0%,#5b2a3e 45%,#1f3b57 100%);position:relative}
.arte::after{content:"ISALTINO";position:absolute;left:8%;bottom:7%;font-family:"Archivo";font-weight:700;font-size:var(--letraArte,28px);letter-spacing:2px;color:rgba(255,255,255,.9)}
.c3d{width:300px;height:300px;border-radius:4px;transform:rotateY(14deg) rotateX(6deg) rotateZ(-1deg);box-shadow:-14px 18px 0 -2px rgba(110,48,34,.9),0 50px 70px rgba(0,0,0,.55)}
.c3d.flutua{animation:flutua 4.6s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:rotateY(14deg) rotateX(6deg) rotateZ(-1deg) translateY(0)}50%{transform:rotateY(12.5deg) rotateX(7deg) rotateZ(-1deg) translateY(-6px)}}
.csimple{width:310px;height:310px;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.cfull{width:390px;height:390px;border-radius:0;--letraArte:34px}
.pontos{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}
.pontos i{width:6px;height:6px;border-radius:3px;background:var(--text);opacity:.35}
.pontos i:first-child{opacity:1;background:var(--acento)}
.tit{display:flex;align-items:center;padding:18px 24px 0;gap:8px}
.tit .lado{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.tit .lado svg{width:24px;height:24px}
.tit .meio{flex:1;text-align:center;min-width:0}
.tit.esq .meio{text-align:left}
.tit .m1{font-size:22px;font-weight:700;letter-spacing:-.2px;font-family:var(--fonteTitulos)}
.tit .m2{font-size:16px;color:var(--t2);margin-top:2px}
.barra{padding:20px 28px 0}
.trilho{height:var(--alturaBarra,4px);border-radius:4px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.trilho b{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--acento)}
.tempos{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:8px}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:14px 36px 0}
.ctl > svg{width:26px;height:26px}
.play{width:72px;height:72px;border-radius:36px;display:flex;align-items:center;justify-content:center}
.play svg{width:30px;height:30px}
.play.filled{background:var(--text);color:#0A0A0F}
.play.ring{border:2.5px solid var(--acento);color:var(--text)}
.play.icon{color:var(--text)}
.play.icon svg{width:44px;height:44px}
.rod{display:flex;justify-content:space-around;padding:22px 30px 0;color:var(--t2)}
.rod svg{width:22px;height:22px}
.rod .ativo{color:var(--acento)}

/* ---------- a Home ---------- */
.home{position:absolute;inset:54px 0 0;overflow:hidden}
.hcab{display:flex;justify-content:space-between;align-items:center;padding:4px 20px 10px}
.hcab .t{font-size:32px;font-weight:700;font-family:var(--fonteTitulos);letter-spacing:-.3px}
.hcab .b{width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.sec{font-size:20px;font-weight:700;padding:6px 20px 10px;font-family:var(--fonteTitulos)}
.grelha{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px 14px}
.atal{height:52px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;overflow:hidden;font-size:13px;font-weight:600}
.atal i{width:52px;height:52px;flex:none}
.lin{display:flex;align-items:center;gap:12px;padding:0 20px;height:var(--alturaLinha,64px)}
.lin .cp{width:var(--capaLinha,48px);height:var(--capaLinha,48px);border-radius:6px;flex:none;position:relative}
.lin .tx{flex:1;min-width:0}
.lin .a{font-size:15px;font-weight:500}
.lin .b2{font-size:13px;color:var(--t2)}
.lin.toca .a{color:var(--acento)}
.barras{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;background:rgba(0,0,0,.45);border-radius:6px}
.barras u{width:3px;border-radius:2px;background:var(--acento);text-decoration:none}
.doca{position:absolute;left:0;right:0;bottom:0;background:rgba(18,18,24,.92);backdrop-filter:blur(20px);border-top:.5px solid rgba(255,255,255,.08)}
.minip{display:flex;align-items:center;gap:12px;padding:10px 20px;height:64px}
.minip .cp{width:44px;height:44px;border-radius:6px}
.minip .tx{flex:1;font-size:14px;font-weight:600}
.minip .tx small{display:block;font-weight:400;color:var(--t2);font-size:12.5px}
.fio{height:2px;background:rgba(255,255,255,.12);margin:0 20px}
.fio b{display:block;height:2px;width:38%;background:var(--acento)}
.seps{display:flex;justify-content:space-around;padding:8px 10px 30px}
.sep{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--t3);font-size:11px}
.sep svg{width:24px;height:24px}
.sep.on{color:var(--acento)}
</style>
</head>

  raiz.setProperty('--acento', acento());

  raiz.setProperty('--fonteTitulos', S.titulos === 'serif' ? 'Georgia, "New York", serif' : S.titulos === 'mono' ? '"JetBrains Mono", Menlo, monospace' : 'var(--sys)');
  for (const id of ['telDef', 'telNp', 'telHome']) document.getElementById(id).style.background = fundoDaApp();
}

/* ---------- Customise ---------- */
function seg(chave, opcoes) {
  return `<div class="seg">${opcoes.map(([v, r]) => `<button data-k="${chave}" data-v="${v}" class="${S[chave] === v ? 'on' : ''}">${r}</button>`).join('')}</div>`;
}
function linha(rotulo, valor, corpo = '') { return `<div class="linha"><div class="r"><span>${rotulo}</span><span class="v">${valor ?? ''}</span></div>${corpo}</div>`; }
function miniTema(id) {
  const t = TEMAS[id];
  const fundo = t.fundoApp === 'oled' || t.fundo === 'black' ? '#000' : t.fundo === 'colour' ? '#5a2c22' : 'linear-gradient(160deg,#6a2f22,#18232f)';
  const arte = t.capa === 'full' ? '<i style="position:absolute;left:0;right:0;top:20px;height:62px;background:linear-gradient(135deg,#C76B4A,#1f3b57)"></i>'
    : `<i style="position:absolute;left:17px;top:26px;width:48px;height:48px;border-radius:${t.capa === 'simple' ? 4 : 2}px;background:linear-gradient(135deg,#C76B4A,#1f3b57);${t.capa === '3d' ? 'transform:perspective(200px) rotateY(16deg)' : ''}"></i>`;
  return `<div class="tema ${S.tema === id ? 'on' : ''}" data-tema="${id}"><div class="mini" style="background:${fundo}">${arte}<i style="position:absolute;left:14px;right:14px;bottom:24px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)"></i><i style="position:absolute;left:14px;width:22px;bottom:24px;height:3px;border-radius:2px;background:${CORES[t.acento]}"></i></div><span>${t.nome}</span></div>`;
}
function desenharDef() {
  const el = document.getElementById('telDef');
  const rolagem = el.querySelector('.def')?.scrollTop ?? 0;
  el.innerHTML = ESTADO + `<div class="def">
    <div class="defcab">‹ <b>Settings</b></div>
    <div class="deftit">Customise</div>
    <div class="temas">${Object.keys(TEMAS).map(miniTema).join('')}<div class="tema ${S.tema === 'custom' ? 'on' : ''}"><div class="mini" style="display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--t3)">✎</div><span>Custom</span></div></div>
    <div class="grupo-t">App</div>
    <div class="grupo">
      ${linha('Accent', NOMES_DAS_CORES[S.acento], `<div class="cores">${Object.keys(CORES).map((k) => `<div class="cor ${k === 'capa' ? 'capa' : ''} ${S.acento === k ? 'on' : ''}" data-k="acento" data-v="${k}" title="${NOMES_DAS_CORES[k]}" style="${k === 'capa' ? '' : `background:${CORES[k]}`}"></div>`).join('')}</div>`)}
      ${linha('Background', '', seg('fundoApp', [['dark', 'Dark'], ['oled', 'OLED'], ['tinted', 'Tinted']]))}
      ${linha('Lists', '', seg('listas', [['comfortable', 'Comfortable'], ['compact', 'Compact']]))}
      ${linha('Titles', '', seg('titulos', [['default', 'Default'], ['serif', 'Serif'], ['mono', 'Mono']]))}
      <div class="linha"><div class="r"><span>Tab bar labels</span><div class="inter ${S.rotulos ? 'on' : ''}" data-toggle="rotulos"></div></div></div>
    </div>
    <div class="grupo-t">Now Playing</div>
    <div class="grupo">
      ${linha('Artwork', '', seg('capa', [['3d', 'Floating 3D'], ['simple', 'Simple'], ['full', 'Full']]))}
      ${S.capa === '3d' ? `<div class="linha"><div class="r"><span>Float</span><div class="inter ${S.flutuar ? 'on' : ''}" data-toggle="flutuar"></div></div></div>` : ''}
      ${linha('Background', '', seg('fundo', [['blur', 'Blur'], ['colour', 'Colour'], ['gradient', 'Gradient'], ['black', 'Black']]))}
      ${S.fundo === 'blur' || S.fundo === 'gradient' ? linha('Background brightness', '', `<input type="range" min="0" max="100" value="${S.intensidade}" data-range="intensidade">`) : ''}
      ${linha('Top', '', seg('topo', [['marca', 'Duotone'], ['origem', 'Playing from']]))}
      ${linha('Title', '', seg('titulo', [['centro', 'Centred'], ['esquerda', 'Left']]))}
      ${linha('Progress bar', '', seg('barra', [['thin', 'Thin'], ['thick', 'Thick']]))}
      ${linha('Play button', '', seg('play', [['filled', 'Filled'], ['ring', 'Ring'], ['icon', 'Icon']]))}
      ${linha('Buttons below', `${S.botoes.length} of 4`, `<div class="chips">${Object.keys(NOMES_DOS_BOTOES).map((k) => `<button class="chip ${S.botoes.includes(k) ? 'on' : ''}" data-botao="${k}">${NOMES_DOS_BOTOES[k]}</button>`).join('')}</div>`)}
    </div>
    <div class="grupo-t" style="text-transform:none;letter-spacing:0;font-size:12.5px;line-height:1.5;padding-top:8px">Saved on this iPhone. Themes change several options at once; changing one by hand makes it Custom.</div>
  </div>`;
  el.querySelector('.def').scrollTop = rolagem;
  ligarDef(el);
}
function ligarDef(el) {
  el.querySelectorAll('[data-tema]').forEach((b) => b.onclick = () => { const { nome, ...t } = TEMAS[b.dataset.tema]; S = { ...S, ...t, tema: b.dataset.tema }; tudo(); });
  el.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { S[b.dataset.k] = b.dataset.v; S.tema = 'custom'; tudo(); });
  el.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => { S[b.dataset.toggle] = !S[b.dataset.toggle]; S.tema = 'custom'; tudo(); });
  el.querySelectorAll('[data-range]').forEach((r) => r.oninput = () => { S[r.dataset.range] = Number(r.value); S.tema = 'custom'; desenharNp(); });
  el.querySelectorAll('[data-botao]').forEach((b) => b.onclick = () => {
    const k = b.dataset.botao;
    if (S.botoes.includes(k)) S.botoes = S.botoes.filter((x) => x !== k);
    else if (S.botoes.length < 4) S.botoes = [...S.botoes, k];
    S.tema = 'custom'; tudo();
  });
}

/* ---------- o leitor ---------- */
function desenharNp() {
  const el = document.getElementById('telNp');
  const luz = S.intensidade / 100;
  const fundos = {
    blur: { f: 'radial-gradient(420px 360px at 30% 30%,#8a3b2a,transparent 70%),radial-gradient(380px 380px at 75% 55%,#2f4f6b,transparent 70%),linear-gradient(160deg,#5a2a1f,#1a2633)', filtro: 'blur(30px)', veu: `linear-gradient(180deg,rgba(10,10,15,${.55 - luz * .4}) 0%,rgba(10,10,15,${.85 - luz * .3}) 55%,#0A0A0F 100%)` },
    colour: { f: '#6b2f22', filtro: 'none', veu: 'linear-gradient(180deg,rgba(10,10,15,.05) 0%,rgba(10,10,15,.35) 60%,rgba(10,10,15,.9) 100%)' },
    gradient: { f: 'linear-gradient(200deg,#C76B4A,#1f3b57,#5b2a3e)', filtro: 'none', veu: `linear-gradient(180deg,rgba(10,10,15,${.5 - luz * .35}) 0%,rgba(10,10,15,.88) 100%)`, anima: true },
    black: { f: '#000', filtro: 'none', veu: 'transparent' },
  }[S.fundo];
  const topo = S.topo === 'marca'
    ? `<div class="marca" style="display:flex;flex-direction:column;align-items:center"><img src="${LOGO}" alt=""><span>DUOTONE</span></div>`
    : `<div class="origem"><div class="l1"><img src="${LOGO}" alt=""><span class="olho">Playing from</span></div><div class="nome">Liked Songs</div></div>`;
  const capa = S.capa === 'full' ? '<div class="arte cfull"></div>'
    : S.capa === 'simple' ? '<div class="arte csimple"></div>'
    : `<div class="arte c3d ${S.flutuar ? 'flutua' : ''}"></div>`;
  const barra = `<div class="trilho" style="--alturaBarra:${S.barra === 'thick' ? '8px' : '4px'}"><b></b></div>`;
  const coracao = `<div class="lado">${svg('<path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.8 6.4 4.8c2 0 3.6 1.2 4.4 2.6.8-1.4 2.4-2.6 4.4-2.6 3.4 0 5.2 3.4 3.6 6.6C19 15.6 12 20 12 20z" fill="currentColor"/>', `style="color:${acento()}"`)}</div>`;
  const mais = `<div class="lado">${svg('<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>')}</div>`;
  const tituloEsq = S.titulo === 'esquerda';
  el.innerHTML = `<div class="np">
    <div class="npfundo" style="background:${fundos.f};filter:${fundos.filtro};${fundos.anima ? 'background-size:200% 200%;animation:grad 9s ease-in-out infinite alternate' : ''}"></div>
    <div class="npveu" style="background:${fundos.veu}"></div>
  </div>` + ESTADO + `<div class="npc">
    <div class="cab"><div class="btn">${svg('<path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>')}</div><div class="centro">${topo}</div><div class="btn">${svg('<path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>')}</div></div>
    <div class="capa-area">${capa}</div>
    <div class="pontos"><i></i><i></i></div>
    <div class="tit ${tituloEsq ? 'esq' : ''}">${tituloEsq ? '' : coracao}<div class="meio"><div class="m1">Isaltino</div><div class="m2">Plutónio</div></div>${tituloEsq ? coracao + mais : mais}</div>
    <div class="barra">${barra}<div class="tempos"><span>1:25</span><span>3:43</span></div></div>
    <div class="ctl">
      ${svg('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke-linecap="round" stroke-linejoin="round"/>', 'style="opacity:.6"')}
      ${svg('<path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor" stroke="none"/>')}
      <div class="play ${S.play}">${svg('<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>')}</div>
      ${svg('<path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor" stroke="none"/>')}
      ${svg('<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3" stroke-linecap="round" stroke-linejoin="round"/>', 'style="opacity:.6"')}
    </div>
    <div class="rod">${S.botoes.map((k) => `<span title="${NOMES_DOS_BOTOES[k]}">${svg(ICONES[k])}</span>`).join('') || '<span style="height:22px"></span>'}</div>
  </div>`;
}

/* ---------- a Home ---------- */
function desenharHome() {
  const el = document.getElementById('telHome');
  const compacta = S.listas === 'compact';
  const linhas = [['Isaltino', 'Plutónio', true], ['Mo Boy', 'Dillaz', false], ['Lucid Dreams', 'Juice WRLD', false], ['Fuera Del Planeta', 'Eloy', false], ['Unstoppable', 'Sia', false], ['Sem Ti', 'Slow J', false], ['Telescópio', 'Isak', false]];
  const cores = ['#C76B4A', '#3d5a80', '#8c5e9e', '#c99a3a', '#4f8a6e', '#a84a4a', '#2f6f8f'];
  const seps = [['Home', '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" stroke-linejoin="round"/>'], ['Songs', '<path d="M9 18V5l11-2v13" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'], ['Artists', '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke-linecap="round"/>'], ['Playlists', '<path d="M4 6h16M4 12h10M4 18h10M18 14v6l3-2" stroke-linecap="round"/>'], ['Profile', '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/>']];
  el.innerHTML = ESTADO + `<div class="home" style="--alturaLinha:${compacta ? '52px' : '64px'};--capaLinha:${compacta ? '40px' : '48px'}">
    <div class="hcab"><span class="t">Home</span><span class="b">${svg('<path d="M4 6h16v10H8l-4 4z" stroke-linejoin="round"/>', 'style="width:18px;height:18px"')}</span></div>
    <div class="grelha">${['Liked Songs', 'Daily mix', 'Plutónio Mix', 'Rap tuga'].map((n, i) => `<div class="atal"><i style="background:linear-gradient(135deg,${cores[i]},#1f2433)"></i>${n}</div>`).join('')}</div>
    <div class="sec">Liked Songs</div>
    ${linhas.map(([a, b, toca], i) => `<div class="lin ${toca ? 'toca' : ''}"><div class="cp" style="background:linear-gradient(135deg,${cores[i]},#1f2433)">${toca ? '<div class="barras"><u style="height:10px"></u><u style="height:16px"></u><u style="height:7px"></u></div>' : ''}</div><div class="tx"><div class="a">${a}</div><div class="b2">${b}</div></div><span style="color:var(--t3)">···</span></div>`).join('')}
  </div>
  <div class="doca">
    <div class="minip"><div class="cp" style="background:linear-gradient(135deg,#C76B4A,#1f3b57)"></div><div class="tx">Isaltino<small>Plutónio</small></div>${svg('<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>', 'style="width:26px;height:26px"')}</div>
    <div class="fio"><b></b></div>
    <div class="seps">${seps.map(([n, d], i) => `<div class="sep ${i === 0 ? 'on' : ''}">${svg(d)}${S.rotulos ? `<span>${n.toLowerCase()}</span>` : ''}</div>`).join('')}</div>
  </div>`;
}

function tudo() { aplicarVariaveis(); desenharDef(); desenharNp(); desenharHome(); }
const estilo = document.createElement('style');
estilo.textContent = '@keyframes grad{from{background-position:0% 0%}to{background-position:100% 100%}}';
document.head.appendChild(estilo);
tudo();
</script>
</body>
</html>
