name: Build Windows (.exe)

# Espelha o build-ios.yml, do lado do PC:
#
#   workflow_dispatch        -> .exe como artefacto, para testar
#   push de uma tag win-v*   -> .exe publicado como Release
#
# Lançar uma versão de PC passa a ser:
#   git tag win-v1.1.0 && git push origin win-v1.1.0
#
# Deixa de ser preciso compilar na tua máquina e arrastar o ficheiro.
on:
  workflow_dispatch:
  push:
    tags: ['win-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # Sem o histórico completo não há tags anteriores nem commits para
          # construir as notas da versão -- o checkout traz 1 commit por defeito.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcular SHA e versão
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/win-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "release=true"          >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
            echo "version=${TAG#win-v}"  >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar TypeScript e regressões
        run: npm run typecheck && npm test

      - name: Criar .env a partir do secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # O electron-builder lê a versão do package.json — sem isto o instalador
      # sairia com a versão antiga mesmo estando a lançar outra.
      - name: Alinhar versões com a tag
        if: steps.vars.outputs.release == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = '${{ steps.vars.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('package.json -> ' + p.version);
          "

      - name: Gravar identificador da build
        run: |
          cat > src/lib/buildInfo.ts <<EOF
          // Gerado automaticamente pela CI (build-windows.yml) a cada build.
          // Não editar à mão -- é sobrescrito no próximo push.
          export const BUILD_ID = '${{ steps.vars.outputs.short_sha }}';
          export const APP_VERSION = '${{ steps.vars.outputs.version }}';
          EOF

      # Não se usa `npm run desktop:build` aqui de propósito. Em CI e sobre uma
      # tag, o electron-builder assume que também lhe compete publicar no
      # GitHub Releases e aborta por não ter GH_TOKEN -- mesmo tendo gerado o
      # instalador com sucesso. Quem publica é o passo `gh release create`
      # mais abaixo, que garante o nome de ficheiro que o portfólio procura.
      - name: Compilar bundle web
        run: npm run web:build

      - name: Empacotar instalador
        run: npx electron-builder --win --publish never

      # O electron-builder gera "Duotone Setup 1.1.0.exe" (com espaços e a
      # versão no nome). O portfólio procura um nome fixo.
      - name: Normalizar nome do instalador
        id: pack
        run: |
          set -euo pipefail
          SRC=$(find release -maxdepth 1 -name "*.exe" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::O electron-builder não produziu nenhum .exe."
            ls -la release || true
            exit 1
          fi
          mv "$SRC" "release/Duotone-Setup.exe"
          ls -lh release/Duotone-Setup.exe

      - name: Publicar .exe como artefacto
        if: steps.vars.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Duotone-exe-${{ steps.vars.outputs.short_sha }}
          path: release/Duotone-Setup.exe
          retention-days: 30

      # As notas saem dos commits, não do --generate-notes: sem pull requests
      # esse só produz um link "Full Changelog" e nada mais.
      #
      # Para escrever as notas à mão, marca a tag com uma mensagem:
      #   git tag -a win-v1.1.0 -m "- Corrige X\n- Adiciona Y"
      # A mensagem da tag ganha sempre à lista automática.
      - name: Preparar notas da versão
        if: steps.vars.outputs.release == 'true'
        id: notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # Só uma tag ANOTADA tem mensagem própria. Numa tag simples o git
          # devolve a mensagem do commit apontado, que não são notas de versão.
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          else
            BODY=""
          fi

          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            PREV=$(git tag -l 'win-v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
            if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
            BODY=$(git log --no-merges --pretty=format:'- %s' "$RANGE" | head -20)
            # O link de comparação sozinho conta como conteúdo e escondia o
            # caso de a lista vir vazia (tag anterior no mesmo commit).
            [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && BODY="- Sem alterações de código desde $PREV."
            if [ -n "$PREV" ]; then
              LINK="https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
              BODY=$(printf '%s\n\nComparar com %s: %s' "$BODY" "$PREV" "$LINK")
            fi
          fi

          [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && BODY="Sem alterações registadas."

          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- notas ---"; echo "$BODY"

      - name: Publicar Release
        if: steps.vars.outputs.release == 'true'
        # As notas passam por env e NAO por interpolacao directa no script.
        # O ${{ }} do Actions e substituido como TEXTO CRU antes de o shell
        # analisar a linha, por isso uma aspa numa mensagem de commit fechava
        # a string e partia o passo -- foi o que aconteceu na ios-v1.2.0, cujo
        # assunto tinha 'ecra "A tua escuta"' e deu `no matches found for tua`.
        # Por env, o runner define a variavel e o shell nunca lhe toca; fecha
        # tambem a porta a injeccao de comandos por mensagem de commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$TAG" \
            "release/Duotone-Setup.exe" \
            --title "Duotone para Windows $VERSION" \
            --notes "$NOTES" \
            --verify-tag
          echo "Publicado $TAG."

      # Ver a nota equivalente no build-ios.yml: releases criados com o
      # GITHUB_TOKEN não disparam `release: published`.
      - name: Avisar o portfólio
        if: steps.vars.outputs.release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          PORTFOLIO_REPO: joaoafonso2004/Portfolio
        run: |
          gh api -X POST "repos/$PORTFOLIO_REPO/dispatches" \
            -f event_type=release-published \
            -F "client_payload[platform]=windows" \
            -F "client_payload[tag]=${{ steps.vars.outputs.tag }}"
