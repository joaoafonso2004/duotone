name: Build iOS (.ipa sem assinatura)

# Corre automaticamente em cada push ao main, ou manualmente
# no separador Actions -> "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular SHA curto
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Grava o commit exato desta build dentro do bundle JS, visível em
      # Definições > About -- para nunca mais haver dúvida sobre qual build
      # está de facto a correr no telemóvel (ficheiros .ipa com nomes iguais
      # de builds diferentes já causaram confusão).
      - name: Gravar identificador da build
        run: |
          cat > src/lib/buildInfo.ts <<EOF
          // Gerado automaticamente pela CI (build-ios.yml) a cada build.
          // Não editar à mão -- é sobrescrito no próximo push.
          export const BUILD_ID = '${{ steps.vars.outputs.short_sha }}';
          EOF

      # O expo-video puxa uma dependência SPM que exige Swift 6.2. O Xcode 16.4
      # (default no runner) só traz Swift 6.1, por isso escolhemos o mais recente
      # instalado (Xcode 26+, Swift 6.2).
      - name: Selecionar Xcode com Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # O .env não vai no repositório; vem do secret ENV_FILE
      # (Settings -> Secrets and variables -> Actions)
      - name: Criar .env a partir do secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Gerar projeto nativo iOS (prebuild)
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Instalar pods
        run: cd ios && pod install

      - name: Compilar Release (sem assinatura)
        run: |
          xcodebuild -workspace ios/Duotone.xcworkspace \
            -scheme Duotone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Duotone.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Empacotar .ipa
        run: |
          mkdir Payload
          cp -R build/Duotone.xcarchive/Products/Applications/Duotone.app Payload/
          zip -qr "Duotone-${{ steps.vars.outputs.short_sha }}.ipa" Payload

      - name: Publicar .ipa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Duotone-ipa-${{ steps.vars.outputs.short_sha }}
          path: Duotone-${{ steps.vars.outputs.short_sha }}.ipa
          retention-days: 30
