name: Build iOS (.ipa sem assinatura)

# Dois modos, o mesmo build:
#
#   push para main/Testing  -> .ipa como artefacto, para testar
#   push de uma tag ios-v*  -> .ipa publicado como Release, e o portfólio
#                              atualiza-se sozinho a seguir
#
# Lançar uma versão passa a ser:
#   git tag ios-v1.2.0 && git push origin ios-v1.2.0
on:
  workflow_dispatch:
  push:
    branches: [main, Testing]
    tags: ['ios-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sem o histórico completo não há tags anteriores nem commits para
          # construir as notas da versão -- o checkout traz 1 commit por defeito.
          fetch-depth: 0

      - name: Calcular SHA e versão
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "release=true"        >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
            echo "version=${TAG#ios-v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          fi

      # A versão da tag manda sobre a do app.json, para que o Info.plist, o
      # bundle-version do manifest e o APP_VERSION que a app compara digam
      # todos o mesmo. Divergirem faria a app avisar-se a si própria em ciclo.
      - name: Alinhar a versão do app.json com a tag
        if: steps.vars.outputs.release == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json'));
            const was = j.expo.version;
            j.expo.version = '${{ steps.vars.outputs.version }}';
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
            console.log('app.json: ' + was + ' -> ' + j.expo.version);
          "

      # Grava o commit exato desta build dentro do bundle JS, visível em
      # Definições > About -- para nunca mais haver dúvida sobre qual build
      # está de facto a correr no telemóvel (ficheiros .ipa com nomes iguais
      # de builds diferentes já causaram confusão).
      - name: Gravar identificador da build
        run: |
          cat > src/lib/buildInfo.ts <<EOF
          // Gerado automaticamente pela CI (build-ios.yml) a cada build.
          // Não editar à mão -- é sobrescrito no próximo push.
          export const BUILD_ID = '${{ steps.vars.outputs.short_sha }}';
          export const APP_VERSION = '${{ steps.vars.outputs.version }}';
          EOF
          echo "Build ${{ steps.vars.outputs.short_sha }} da versão ${{ steps.vars.outputs.version }}"

      # O expo-video puxa uma dependência SPM que exige Swift 6.2. O Xcode 16.4
      # (default no runner) só traz Swift 6.1, por isso escolhemos o mais recente
      # instalado (Xcode 26+, Swift 6.2).
      - name: Selecionar Xcode com Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar TypeScript e regressões
        run: npm run typecheck && npm test

      # O .env não vai no repositório; vem do secret ENV_FILE
      # (Settings -> Secrets and variables -> Actions)
      - name: Criar .env a partir do secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Gerar projeto nativo iOS (app + widget)
        run: npx expo prebuild --platform ios --no-install --clean
        env:
          CI: 1

      - name: Instalar pods
        run: cd ios && pod install

      - name: Compilar Release (sem assinatura)
        run: |
          xcodebuild -workspace ios/Duotone.xcworkspace \
            -scheme Duotone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Duotone.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # O plugin pode gerar um alvo sem o embutir no produto principal. Um
      # arquivo que passe sem o .appex daria um IPA válido, mas sem widget.
      - name: Confirmar widget dentro da app
        run: |
          WIDGET="build/Duotone.xcarchive/Products/Applications/Duotone.app/PlugIns/DuotoneWidget.appex"
          test -d "$WIDGET"
          plutil -p "$WIDGET/Info.plist"

      # Nos releases o ficheiro chama-se sempre Duotone.ipa, porque é esse o
      # nome que o portfólio procura. Nas builds de teste mantém-se o SHA no
      # nome, para não haver dúvidas sobre qual build se instalou.
      - name: Empacotar .ipa
        id: pack
        run: |
          mkdir Payload
          cp -R build/Duotone.xcarchive/Products/Applications/Duotone.app Payload/
          if [ "${{ steps.vars.outputs.release }}" = "true" ]; then
            NAME="Duotone.ipa"
          else
            NAME="Duotone-${{ steps.vars.outputs.short_sha }}.ipa"
          fi
          zip -qr "$NAME" Payload
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Publicar .ipa como artefacto
        if: steps.vars.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Duotone-ipa-${{ steps.vars.outputs.short_sha }}
          path: ${{ steps.pack.outputs.name }}
          retention-days: 30

      # As notas saem dos commits, não do --generate-notes: sem pull requests
      # esse só produz um link "Full Changelog" e nada mais.
      #
      # Para escrever as notas à mão, marca a tag com uma mensagem:
      #   git tag -a ios-v1.1.0 -m "- Corrige X\n- Adiciona Y"
      # A mensagem da tag ganha sempre à lista automática.
      - name: Preparar notas da versão
        if: steps.vars.outputs.release == 'true'
        id: notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # Só uma tag ANOTADA tem mensagem própria. Numa tag simples o git
          # devolve a mensagem do commit apontado, que não são notas de versão.
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          else
            BODY=""
          fi

          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            PREV=$(git tag -l 'ios-v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
            if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
            BODY=$(git log --no-merges --pretty=format:'- %s' "$RANGE" | head -20)
            # O link de comparação sozinho conta como conteúdo e escondia o
            # caso de a lista vir vazia (tag anterior no mesmo commit).
            [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && BODY="- Sem alterações de código desde $PREV."
            if [ -n "$PREV" ]; then
              LINK="https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
              BODY=$(printf '%s\n\nComparar com %s: %s' "$BODY" "$PREV" "$LINK")
            fi
          fi

          [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && BODY="Sem alterações registadas."

          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- notas ---"; echo "$BODY"

      # Criar o release aqui (em vez de à mão) é o que fecha o ciclo: a tag
      # dispara a build, a build publica, e o release publicado avisa o
      # portfólio através do release.yml.
      - name: Publicar Release
        if: steps.vars.outputs.release == 'true'
        # As notas passam por env e NAO por interpolacao directa no script.
        # O ${{ }} do Actions e substituido como TEXTO CRU antes de o shell
        # analisar a linha, por isso uma aspa numa mensagem de commit fechava
        # a string e partia o passo -- foi o que aconteceu na ios-v1.2.0, cujo
        # assunto tinha 'ecra "A tua escuta"' e deu `no matches found for tua`.
        # Por env, o runner define a variavel e o shell nunca lhe toca; fecha
        # tambem a porta a injeccao de comandos por mensagem de commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ASSET: ${{ steps.pack.outputs.name }}
          VERSION: ${{ steps.vars.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$TAG" \
            "$ASSET" \
            --title "Duotone iOS $VERSION" \
            --notes "$NOTES" \
            --verify-tag
          echo "Publicado $TAG."

      # Um release criado com o GITHUB_TOKEN não dispara o evento
      # `release: published` -- é uma proteção do GitHub contra workflows
      # recursivos. Por isso avisa-se o portfólio aqui, em vez de contar com
      # o release.yml. Se falhar, o sync agendado apanha na mesma.
      - name: Avisar o portfólio
        if: steps.vars.outputs.release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          PORTFOLIO_REPO: joaoafonso2004/Portfolio
        run: |
          gh api -X POST "repos/$PORTFOLIO_REPO/dispatches" \
            -f event_type=release-published \
            -F "client_payload[platform]=ios" \
            -F "client_payload[tag]=${{ steps.vars.outputs.tag }}"
