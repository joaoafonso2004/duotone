name: Release Windows (Tauri)

# A Duotone para Windows em Tauri, a partir da 7.0.0 (o plano do Tauri, F12).
#
#   push de uma tag win-v7.* ou acima -> o instalador Tauri publicado como Release
#
# As tags win-v6.* (e abaixo) continuam no build-windows.yml, em Electron: a
# versão ponte (6.2.0) sai por lá. A ordem é essa: primeiro a ponte, que exporta
# a sessão e as preferências de cada PC; só depois a 7.0.0, que as repõe.
#
# O instalador chama-se Duotone-Setup.exe, como o do Electron: é o nome que o
# atualizador do Electron (e o desta casca, canal.rs) aceita, e o portfólio
# procura. Os ganchos NSIS (desktop/nsis/ganchos.nsh) retiram o Electron.
#
# Lançar: git tag -a win-v7.0.0 -m "notas" && git push origin win-v7.0.0
# (só quando o João pedir; para obrigar, "Minimum version: 7.0.0" nas notas,
# ver docs/OBRIGAR-A-ATUALIZAR.md).
on:
  push:
    tags: ['win-v[7-9].*', 'win-v[1-9][0-9].*']

permissions:
  contents: write

env:
  RUST_VERSION: '1.97.1'
  TAURI_CLI: '@tauri-apps/cli@2.12.6'
  CARGO_INCREMENTAL: '0'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # As notas saem das tags e dos commits anteriores (como no build-windows.yml).
          fetch-depth: 0

      - name: Repor as tags anotadas
        run: git fetch --force --tags origin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versão a partir da tag
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSAO="${TAG#win-v}"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag $TAG não é win-vX.Y.Z."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSAO" >> "$GITHUB_OUTPUT"

      - name: Rust fixo
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/AppData/Local/tauri
            desktop/target-producao
            !desktop/target-producao/release/bundle
          key: windows-producao-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-producao-${{ env.RUST_VERSION }}-

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar TypeScript e regressões
        run: npm run typecheck && npm test

      - name: Criar .env a partir do secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # A versão da app web (APP_VERSION, o "Minimum version" e o relatório) é a da tag.
      - name: Alinhar versões com a tag
        env:
          VERSAO: ${{ steps.vars.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = process.env.VERSAO;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          printf '{ "version": "%s" }\n' "$VERSAO" > desktop/versao.conf.json

      - name: Compilar a app web para dentro da casca
        run: |
          node scripts/write-build-info.mjs
          npx expo export --platform web --output-dir desktop/dist-web
          test -f desktop/dist-web/index.html

      - name: Testes da casca (identidade de produção)
        working-directory: desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target-producao
        run: |
          cargo clippy --release --all-targets --features producao -- -D warnings
          cargo test --release --features producao
          node ../scripts/test-ponte-tauri.mjs

      - name: Empacotar o instalador
        working-directory: desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target-producao
        run: |
          rm -rf target-producao/release/bundle
          npx -y "$TAURI_CLI" build --features producao --config tauri.producao.conf.json --config versao.conf.json

      - name: Normalizar nome do instalador
        run: |
          set -euo pipefail
          PASTA=desktop/target-producao/release/bundle/nsis
          SRC=$(find "$PASTA" -maxdepth 1 -name "Duotone_*-setup.exe" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::O Tauri não produziu o instalador da Duotone."
            ls -la "$PASTA" || true
            exit 1
          fi
          mkdir -p release
          mv "$SRC" release/Duotone-Setup.exe
          ls -lh release/Duotone-Setup.exe
          sha256sum release/Duotone-Setup.exe

      # As notas como no build-windows.yml: a mensagem da tag anotada ganha à lista automática.
      - name: Preparar notas da versão
        id: notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          else
            BODY=""
          fi
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            PREV=$(git tag -l 'win-v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
            if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
            BODY=$(git log --no-merges --pretty=format:'- %s' "$RANGE" | head -20)
            [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && BODY="- Sem alterações de código desde $PREV."
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- notas ---"; echo "$BODY"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$TAG" \
            "release/Duotone-Setup.exe" \
            --title "Duotone para Windows $VERSION" \
            --notes "$NOTES" \
            --verify-tag
          echo "Publicado $TAG."

      - name: Avisar o portfólio
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          PORTFOLIO_REPO: joaoafonso2004/Portfolio
        run: |
          gh api -X POST "repos/$PORTFOLIO_REPO/dispatches" \
            -f event_type=release-published \
            -F "client_payload[platform]=windows" \
            -F "client_payload[tag]=${{ steps.vars.outputs.tag }}"
