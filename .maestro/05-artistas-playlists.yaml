# Entrar pelo quadrado (artista e playlist), a página, voltar a deslizar e voltar
# pela seta, e segurar um cartão.
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- runFlow:
    file: comum/separador.yaml
    env:
      X: "50%"
- takeScreenshot: 0500-artists
- scroll
- takeScreenshot: 0501-artists-rolada
- runFlow:
    file: comum/separador.yaml
    env:
      X: "50%"
- evalScript: ${console.log('MARCA artista-abrir ' + Date.now())}
- tapOn:
    point: "20%,30%"
- takeScreenshot: 0502-artista-a-abrir
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 0503-artista-aberto
- scroll
- takeScreenshot: 0504-artista-rolado
- scroll
- takeScreenshot: 0505-artista-rolado-mais
- evalScript: ${console.log('MARCA artista-voltar-deslizar ' + Date.now())}
- swipe:
    start: "40%,50%"
    end: "95%,50%"
    duration: 500
- takeScreenshot: 0506-artista-a-voltar
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 0507-artists-de-volta
- runFlow:
    file: comum/separador.yaml
    env:
      X: "70%"
- takeScreenshot: 0508-playlists
- scroll
- takeScreenshot: 0509-playlists-rolada
- runFlow:
    file: comum/separador.yaml
    env:
      X: "70%"
- evalScript: ${console.log('MARCA playlist-abrir ' + Date.now())}
- tapOn:
    point: "25%,36%"
- takeScreenshot: 0510-playlist-a-abrir
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 0511-playlist-aberta
- scroll
- takeScreenshot: 0512-playlist-rolada
- tapOn:
    text: "More options"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 0513-playlist-menu
- tapOn:
    point: "50%,6%"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- evalScript: ${console.log('MARCA playlist-voltar-seta ' + Date.now())}
- tapOn:
    text: "Back"
    optional: true
- takeScreenshot: 0514-playlist-a-voltar
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 0515-playlists-de-volta
- evalScript: ${console.log('MARCA segurar-cartao ' + Date.now())}
- longPressOn:
    point: "25%,36%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 0516-segurar-cartao
- tapOn:
    point: "50%,6%"
    optional: true
