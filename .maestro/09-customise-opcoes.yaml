# Cada opção da Customise: a prévia logo a seguir, e no fim a app real com tudo
# mudado (a Home, as Liked Songs e o leitor).
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- runFlow: comum/customise.yaml
# App
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Lists", VALOR: "Compact", N: "0900-listas-compact" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Titles", VALOR: "Serif", N: "0901-titulos-serif" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Titles", VALOR: "Mono", N: "0902-titulos-mono" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Dark", VALOR: "OLED black", N: "0903-fundo-oled" } }
- tapOn:
    text: "Tab bar labels"
    checked: true
    optional: true
- takeScreenshot: 0904-sem-nomes-na-barra
- tapOn:
    text: "Background follows the song"
    checked: false
    optional: true
- takeScreenshot: 0905-fundo-segue-a-musica
# Now Playing
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Artwork", VALOR: "Simple", N: "0910-capa-simple" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Artwork", VALOR: "Full", N: "0911-capa-full" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Artwork", VALOR: "Poster", N: "0912-capa-poster" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Artwork", VALOR: "Floating 3D", N: "0913-capa-3d" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Top", VALOR: "Playing from", N: "0914-topo-origem" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Title", VALOR: "Left", N: "0915-titulo-esquerda" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Progress bar", VALOR: "Thick", N: "0916-barra-grossa" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Play button", VALOR: "Filled", N: "0917-play-filled" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Play button", VALOR: "Ring", N: "0918-play-ring" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Play button", VALOR: "Icon", N: "0919-play-icon" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Controls", VALOR: "White", N: "0920-controlos-brancos" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Blurred artwork", VALOR: "Artwork colour", N: "0921-fundo-cor" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Artwork colour", VALOR: "Gradient", N: "0922-fundo-gradiente" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Gradient", VALOR: "Black", N: "0923-fundo-preto" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Black", VALOR: "Blurred artwork", N: "0924-fundo-capa" } }
- runFlow: { file: comum/escolha.yaml, env: { LINHA: "Background brightness", VALOR: "Lighter", N: "0925-brilho-lighter" } }
# Os botões de baixo e a letra.
- scrollUntilVisible:
    element: "Share"
    timeout: 10000
    optional: true
- tapOn:
    text: "Share"
    checked: false
    optional: true
- tapOn:
    text: "Lyrics"
    checked: false
    optional: true
- takeScreenshot: 0926-botoes-de-baixo
- scroll
- takeScreenshot: 0927-customise-fim
# A app real com tudo isto.
- runFlow: comum/voltar-a-home.yaml
- takeScreenshot: 0930-real-home
- scroll
- takeScreenshot: 0931-real-home-rolada
- runFlow:
    file: comum/separador.yaml
    env:
      X: "30%"
- takeScreenshot: 0932-real-liked
- tapOn:
    point: "45%, 86%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 0933-real-leitor
- tapOn:
    text: "Minimize player"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
