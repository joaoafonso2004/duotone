# Abre a app e, no ecrã de entrar, entra com a conta de teste (os secrets do CI).
# A app está pronta quando se vê o ecrã de entrar (um elemento só, que CONTÉM
# "Sign in": ver entrar.yaml) ou a Home (o botão da gaveta, a pesquisa, a barra).
appId: com.joao.duotone
---
- launchApp:
    appId: com.joao.duotone
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "(?s).*Sign in.*|.*Open your drawer.*|Songs, artists, playlists…|Home|Songs|Liked Songs"
    timeout: 60000
- runFlow:
    when:
      visible: "(?s).*Forgot password.*"
    file: entrar.yaml
# A primeira vez de uma conta (BoasVindas): saltar.
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- waitForAnimationToEnd:
    timeout: 4000
