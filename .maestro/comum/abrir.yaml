# Abre a app e, no ecrã de entrar, entra com a conta de teste (os secrets do CI).
# A app está pronta quando se vê o ecrã de entrar ("Sign in") ou a Home (o botão
# da gaveta, o campo da pesquisa, ou os nomes da barra).
appId: com.joao.duotone
---
- launchApp:
    appId: com.joao.duotone
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in|Open your drawer|Songs, artists, playlists…|Home|Liked Songs"
    timeout: 60000
- runFlow:
    when:
      visible: "Forgot password?"
    file: entrar.yaml
# A primeira vez de uma conta (BoasVindas): saltar.
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- waitForAnimationToEnd:
    timeout: 4000
