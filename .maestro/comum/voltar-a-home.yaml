# Da Customise de volta à Home: Back, Back, e o separador da Home.
appId: com.joao.duotone
---
- tapOn: "Back"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: separador.yaml
    env:
      X: "10%"
