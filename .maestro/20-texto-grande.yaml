# Com a letra do sistema grande (o workflow muda-a antes): o que corta, o que se
# sobrepõe, os botões que saem do sítio.
appId: com.joao.duotone
tags:
  - texto-grande
---
- runFlow: comum/abrir.yaml
- takeScreenshot: 2000-tg-home
- scroll
- takeScreenshot: 2001-tg-home-rolada
- runFlow:
    file: comum/separador.yaml
    env:
      X: "30%"
- takeScreenshot: 2002-tg-liked
- runFlow:
    file: comum/separador.yaml
    env:
      X: "70%"
- takeScreenshot: 2003-tg-playlists
- runFlow:
    file: comum/separador.yaml
    env:
      X: "90%"
- takeScreenshot: 2004-tg-perfil
- runFlow:
    file: comum/separador.yaml
    env:
      X: "30%"
- tapOn:
    point: "45%,45%"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 2005-tg-leitor
- tapOn:
    text: "Track options"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2006-tg-leitor-menu
- tapOn:
    point: "50%,4%"
    optional: true
- tapOn:
    text: "Minimize player"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2007-tg-mini
- runFlow: comum/customise.yaml
- takeScreenshot: 2008-tg-customise
- tapOn:
    text: "Back"
    optional: true
- takeScreenshot: 2009-tg-definicoes
