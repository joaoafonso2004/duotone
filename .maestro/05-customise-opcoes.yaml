# Uma mão-cheia de opções: a prévia logo a seguir a cada uma, e depois a app real.
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- runFlow: comum/customise.yaml
- tapOn: "Lists"
- tapOn: "Compact"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 40-previa-listas-compactas
- tapOn: "Play button"
- tapOn: "Filled"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 41-previa-play-cheio
- tapOn: "Controls"
- tapOn: "White"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 42-previa-controlos-brancos
- tapOn: "Artwork"
- tapOn: "Full"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 43-previa-capa-full
- tapOn: "Titles"
- tapOn: "Serif"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 44-previa-titulos-serif
- runFlow: comum/voltar-a-home.yaml
- takeScreenshot: 45-home-serif
- runFlow:
    file: comum/separador.yaml
    env:
      X: "30%"
- takeScreenshot: 46-liked-compactas
- tapOn:
    point: "50%, 85%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 47-leitor-full-cheio-branco
