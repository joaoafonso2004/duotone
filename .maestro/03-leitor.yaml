# Pesquisar e tocar uma música: o leitor a abrir, o skip (o Eclipse) e o mini.
# O som pode não chegar (o YouTube corta servidores): o leitor abre na mesma.
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- tapOn: "Songs, artists, playlists…"
- inputText: "Daft Punk One More Time"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*One More Time.*"
    timeout: 25000
    optional: true
- takeScreenshot: 20-pesquisa
- runFlow:
    when:
      visible: ".*One More Time.*"
    commands:
      - tapOn:
          text: ".*One More Time.*"
          index: 0
# Sem resultados: a primeira das Liked Songs.
- runFlow:
    when:
      notVisible: "Minimize player"
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - runFlow:
          file: comum/separador.yaml
          env:
            X: "30%"
      - tapOn:
          point: "50%, 45%"
- extendedWaitUntil:
    visible: "Minimize player"
    timeout: 15000
- takeScreenshot: 21-leitor-aberto
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 22-leitor-parado
- tapOn: "Next track"
- takeScreenshot: 23-skip-logo
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 24-skip-fim
- tapOn: "Next track"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Minimize player"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 25-mini
