# O Liquid Glass: a prévia da Customise e a app de verdade, lado a lado.
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- runFlow: comum/customise.yaml
- takeScreenshot: 30-customise-sem-vidro
- tapOn:
    text: "Liquid Glass"
    checked: false
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 31-customise-com-vidro
- scroll
- takeScreenshot: 32-customise-opcoes-do-vidro
- runFlow: comum/voltar-a-home.yaml
- takeScreenshot: 33-home-com-vidro
- runFlow:
    file: comum/separador.yaml
    env:
      X: "30%"
- takeScreenshot: 34-liked-com-vidro
# O mini (por cima da barra): abre o leitor.
- tapOn:
    point: "50%, 85%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 35-leitor-com-vidro
- tapOn:
    text: "Minimize player"
    optional: true
