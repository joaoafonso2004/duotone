# Do zero: estado limpo, entrar, e a Home da primeira vez.
appId: com.joao.duotone
---
- launchApp:
    appId: com.joao.duotone
    clearState: true
    permissions:
      all: allow
- evalScript: ${console.log('MARCA arranque-a-frio ' + Date.now())}
- extendedWaitUntil:
    visible: "Sign in|Open your drawer|Songs, artists, playlists…|Home|Liked Songs"
    timeout: 90000
- takeScreenshot: 0100-arranque
- runFlow: comum/abrir.yaml
- takeScreenshot: 0101-home-primeira-vez
- scroll
- takeScreenshot: 0102-home-primeira-vez-rolada
