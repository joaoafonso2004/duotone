# Os cinco separadores, o salto longo (Profile -> Home, sem deslizar) e o deslizar.
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- takeScreenshot: 10-home
- runFlow:
    file: comum/separador.yaml
    env:
      X: "30%"
- takeScreenshot: 11-liked-songs
- runFlow:
    file: comum/separador.yaml
    env:
      X: "50%"
- takeScreenshot: 12-artists
- runFlow:
    file: comum/separador.yaml
    env:
      X: "70%"
- takeScreenshot: 13-playlists
- runFlow:
    file: comum/separador.yaml
    env:
      X: "90%"
- takeScreenshot: 14-profile
# O salto de quatro separadores (sem deslizar desde 9d6c511).
- runFlow:
    file: comum/separador.yaml
    env:
      X: "10%"
- takeScreenshot: 15-home-pelo-salto
# Deslizar para o lado (o pager).
- swipe:
    start: "85%, 50%"
    end: "15%, 50%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 16-deslizar-para-liked
- scroll
- takeScreenshot: 17-liked-rolada
