# O Perfil, as estatísticas, e as Definições inteiras (todos os grupos abertos).
appId: com.joao.duotone
---
- runFlow: comum/abrir.yaml
- runFlow:
    file: comum/separador.yaml
    env:
      X: "90%"
- takeScreenshot: 0700-perfil
- scroll
- takeScreenshot: 0701-perfil-rolado
- scroll
- takeScreenshot: 0702-perfil-rolado-mais
- runFlow:
    file: comum/separador.yaml
    env:
      X: "90%"
- tapOn:
    text: "Settings"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 0703-definicoes-topo
# Abrir todos os grupos ("Show all … settings").
- repeat:
    times: 8
    commands:
      - scrollUntilVisible:
          element: "Show all .* settings"
          timeout: 8000
          optional: true
      - tapOn:
          text: "Show all .* settings"
          optional: true
- tapOn:
    point: "50%,6%"
    optional: true
- swipe:
    start: "50%,25%"
    end: "50%,95%"
    duration: 150
- swipe:
    start: "50%,25%"
    end: "50%,95%"
    duration: 150
- swipe:
    start: "50%,25%"
    end: "50%,95%"
    duration: 150
- takeScreenshot: 0704-definicoes-abertas-topo
- scroll
- takeScreenshot: 0705-definicoes-1
- scroll
- takeScreenshot: 0706-definicoes-2
- scroll
- takeScreenshot: 0707-definicoes-3
- scroll
- takeScreenshot: 0708-definicoes-4
- scroll
- takeScreenshot: 0709-definicoes-5
- scroll
- takeScreenshot: 0710-definicoes-6
- scroll
- takeScreenshot: 0711-definicoes-7
- scroll
- takeScreenshot: 0712-definicoes-8
- tapOn:
    text: "Back"
    optional: true
