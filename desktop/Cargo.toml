[package]
name = "duotone-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "A casca do Duotone para Windows em Tauri (ver .claude/planos/PLANO-TAURI.md, fora do git)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Versão do Tauri FIXA: o with_webview (WebView2) pode mudar entre versões menores.
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tiny_http = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "http2", "charset", "json", "blocking"] }
percent-encoding = "2"
sha1 = "0.10"
base64 = "0.22"
# As mesmas versões que o wry usa, para os tipos do WebView2 serem os mesmos.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[profile.release]
debug = false
